# Uptime monitor for The Project Library.
#
# Pings the production health endpoint on a schedule. If the site (or the DB / the
# collections read path it exercises) is down, this job fails — and GitHub emails the
# author of this workflow file automatically. This is the cheap, no-extra-account
# alternative to a dedicated uptime service.
#
# To receive the failure emails: GitHub → Settings → Notifications → Actions → email.
#
# Caveats:
#  - Scheduled runs can be delayed under GitHub load; treat this as "within ~15-30 min"
#    detection, not real-time.
#  - GitHub auto-disables scheduled workflows after 60 days of no repo activity.
name: Uptime

on:
  schedule:
    # Every 15 minutes, deliberately offset off :00/:15/:30/:45. GitHub's shared cron
    # scheduler is busiest on the hour and the quarter-hour, and delayed ticks are dropped
    # (not backfilled), so those slots are the most likely to be skipped. :03/:18/:33/:48
    # sidesteps the congestion. Keeps well within free Actions minutes and the 5-min cliff.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {} # allow manual runs for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Use the canonical www host directly. The apex (theprojectlibrary.com) 307-redirects
      # here, and a redirect body ("Redirecting...") silently fails the status:ok assertion
      # below — that was the 2026-07-26 false-alarm cause. --location (below) also follows
      # any future canonicalization flip so this can't recur.
      HEALTH_URL: "https://www.theprojectlibrary.com/api/health"
    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging $HEALTH_URL"
          # --fail: non-2xx exits non-zero. --location: follow redirects (apex→www etc.) so a
          # 3xx never masquerades as a failure. --retry: ride out a single transient blip.
          # --write-out appends the final HTTP code on its own line so the log is self-explanatory.
          response=$(curl --fail --show-error --silent --location \
                          --retry 2 --retry-delay 5 --max-time 20 \
                          --write-out '\n%{http_code}' \
                          "$HEALTH_URL")
          status=$?
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Final HTTP status: $http_code"
          echo "Response body: $body"
          if [ $status -ne 0 ]; then
            echo "::error::Health check request failed (curl exit $status, http $http_code) for $HEALTH_URL"
            exit 1
          fi
          # Second assertion: the endpoint can return 200 only when healthy, but guard
          # against an unexpected 200 that isn't actually "ok".
          if ! echo "$body" | grep -q '"status":"ok"'; then
            echo "::error::Health endpoint did not report status:ok — $body"
            exit 1
          fi
          echo "Health check passed."
