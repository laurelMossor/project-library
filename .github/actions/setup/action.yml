name: Setup
description: Install Node and npm dependencies. The caller must check out the repo first.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22 # matches .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci # postinstall runs `prisma generate`
